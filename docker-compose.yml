services:
  postgres:
    image: postgres:16
    container_name: voice_agent_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: voiceagent
    ports:
      - "5432:5432"
    volumes:
      - voice_agent_postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: voice_agent_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/voiceagent
    ports:
      - "4002:4002"
    depends_on:
      - postgres
    volumes:
      - ./app/static/generated:/app/app/static/generated

volumes:
  voice_agent_postgres_data:
